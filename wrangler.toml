name = "nook"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Video is JaaS (8x8.vc). The RSA signing key + app id are Worker secrets
# (JAAS_APP_ID, JAAS_KID, JAAS_PRIVATE_KEY), set with `wrangler secret put`.

# The Worker also serves the built React app. Static files are served directly;
# unmatched paths (/rooms, /room/:id/ws) fall through to the Worker. Routing is
# hash-based, so every real page path is "/" -> index.html; no SPA fallback needed.
[assets]
directory = "./web/dist"

# Free-plan Durable Objects must be SQLite-backed (new_sqlite_classes).
# We don't use SQL storage — state is in-memory — but the class must be declared this way.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "LobbyDO"]
